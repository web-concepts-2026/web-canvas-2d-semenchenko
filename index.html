<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="workspace">
        <div class="toolbar-top">
            <p>Min</p>
            <input type="range" name="brush-size" id="brush-size" min="1" max="50">
            <p>Max</p>
            <input type="color" name="color" id="color">
            <p id="modeText">Mode: Draw</p>
        </div>
        <div class="toolbar">
            <button type="button" onclick="drawMod()">Draw</button>
            <button type="button" onclick="eraseMod()">Erase</button>
            <button type="button" onclick="stampMod()">Square</button>
            <button type="button" onclick="undoCanvas()">Undo</button>
            <button type="button" onclick="clearCanvas()">Clear</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>
</body>

</html>
